name: ECS dagelijkse prijsupdate

on:
  schedule:
  - cron: '0 3,9,15,21 * * *' # 4x per dag: 03/09/15/21 UTC (15 UTC anchor = 17 CET)
  workflow_dispatch: # ook handmatig te triggeren via GitHub UI

permissions:
  contents: write
jobs:
  fetch-prices:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Python instellen
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Dependencies installeren
      run: pip install requests

    - name: Prijzen ophalen
      env:
        GCORE_API_KEY: ${{ secrets.GCORE_API_KEY }}
        OVH_APP_KEY: ${{ secrets.OVH_APP_KEY }}
        OVH_APP_SECRET: ${{ secrets.OVH_APP_SECRET }}
        OVH_CONSUMER_KEY: ${{ secrets.OVH_CONSUMER_KEY }}
        VERDA_CLIENT_ID: ${{ secrets.VERDA_CLIENT_ID }}
        VERDA_CLIENT_SECRET: ${{ secrets.VERDA_CLIENT_SECRET }}
        HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
        SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      run: python fetch_prices.py

    - name: Wijzigingen committen
      run: |
        git config user.name "ECS Bot"
        git config user.email "bot@kallas.group"
        git add -A
        git diff --staged --quiet || git commit -m "Dagelijkse prijsupdate $(date +%Y-%m-%d)"
        git push
